name: Build Zh Movies APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p android-app/app/src/main/java/com/zhmovies/app
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable

          cat > android-app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path android:fillColor="#16051F" android:pathData="M0,0h512v512h-512z"/>
              <path android:fillColor="#31004D" android:strokeColor="#C43BFF" android:strokeWidth="8" android:pathData="M58,4H454Q508,4 508,58V454Q508,508 454,508H58Q4,508 4,454V58Q4,4 58,4Z"/>
              <path android:fillColor="#F8C64B" android:pathData="M178,86L203,45L229,75L256,22L282,75L309,45L334,86L316,108L196,108Z"/>
              <path android:fillColor="#21102E" android:strokeColor="#F8C64B" android:strokeWidth="10" android:pathData="M91,156L421,112L439,178L108,224Z"/>
              <path android:fillColor="#21102E" android:strokeColor="#F8C64B" android:strokeWidth="10" android:pathData="M105,215H425V389H105Z"/>
              <path android:fillColor="#A020F0" android:pathData="M224,244L224,340L310,292Z"/>
              <path android:fillColor="#F6BD35" android:pathData="M79,410H433V435H79Z"/>
              <path android:fillColor="#A020F0" android:pathData="M239,450L273,475L239,500Z"/>
          </vector>
          EOF
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ZhMovies'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zhmovies.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zhmovies.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Zh Movies"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/zhmovies/app/MainActivity.java <<'EOF'
          package com.zhmovies.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("https://aliresaahmadi191576-cell.github.io/zh-movies/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zh-movies-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
